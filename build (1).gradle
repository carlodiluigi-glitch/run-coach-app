plugins {
    id "com.android.application"
    id "kotlin-android"
    // Il plugin Flutter va applicato dopo Android e Kotlin.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0.0"
}

android {
    namespace = "com.runcoachapp.run_coach_app"
    // compileSdk e targetSdk seguono la versione di Flutter installata:
    // cosi' il progetto resta compatibile anche con Flutter piu' recenti.
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.runcoachapp.run_coach_app"
        // minSdk 23: richiesto dai plugin usati (geolocator, flutter_tts) e
        // copre praticamente tutti i telefoni Android in circolazione.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            // NESSUNA CHIAVE PRIVATA RICHIESTA.
            // La build release usa la firma di debug: l'APK e' installabile
            // subito e GitHub Actions funziona senza configurare secret.
            // Per pubblicare sullo Store andra' creato un keystore dedicato.
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}
