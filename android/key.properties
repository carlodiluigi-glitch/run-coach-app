# Riferimenti alla chiave di firma usata per le build release.
#
# Il percorso di storeFile e' relativo alla cartella android/app/.
#
# NOTA: questo file e la chiave sono volutamente dentro il repository, perche'
# GitHub Actions possa firmare l'APK senza configurare nulla. Non sono quindi
# un segreto: se un giorno l'app andra' sul Play Store, conviene generare una
# chiave nuova, tenerla fuori dal repository e passarla alla CI come secret.
storeFile=runcoach-release.jks
storePassword=runcoach
keyAlias=runcoach
keyPassword=runcoach
