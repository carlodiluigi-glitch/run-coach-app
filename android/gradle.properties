org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=false

# compileSdk segue la versione di Flutter installata e puo' essere piu' recente
# di quella "testata" da Android Gradle Plugin: questa riga evita l'avviso
# bloccante senza cambiare nulla della build.
android.suppressUnsupportedCompileSdk=35,36,37,38

# Build piu' veloce in CI.
org.gradle.parallel=true
org.gradle.caching=true
