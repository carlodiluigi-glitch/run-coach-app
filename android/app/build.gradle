plugins {
    id "com.android.application"
    id "kotlin-android"
    // Il plugin Flutter va applicato dopo Android e Kotlin.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0.0"
}

// Su GitHub Actions il numero progressivo della build diventa il versionCode:
// ogni APK generata risulta piu' recente della precedente e Android la
// installa sopra senza protestare.
def ciRunNumber = System.getenv("GITHUB_RUN_NUMBER")
if (ciRunNumber != null && !ciRunNumber.trim().isEmpty()) {
    flutterVersionCode = ciRunNumber.trim()
}

// ---------------------------------------------------------------------------
// CHIAVE DI FIRMA FISSA
// ---------------------------------------------------------------------------
// Android identifica un'app dalla firma: due APK firmate con chiavi diverse
// sono per il sistema due app diverse, e l'aggiornamento viene rifiutato con
// "il pacchetto e' in conflitto con un pacchetto esistente".
//
// Senza una chiave nostra, ogni build di GitHub Actions ne genera una nuova al
// volo: da qui la necessita' di disinstallare l'app a ogni aggiornamento,
// perdendo attivita', scarpe e impostazioni.
//
// Con la chiave fissa in "android/app/runcoach-release.jks", tutte le build
// sono firmate uguali e le APK si installano una sopra l'altra.
//
// ATTENZIONE: chiave e password stanno nel repository, quindi NON sono un
// segreto. Va bene per un'app che si installa a mano. Prima di pubblicare
// sul Play Store conviene generarne una nuova e tenerla fuori dal repository.
// E soprattutto: conservane una copia altrove. Se la chiave si perde, l'app
// non e' piu' aggiornabile e va ripubblicata da zero.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseKey = keystorePropertiesFile.exists()
if (hasReleaseKey) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

// ---------------------------------------------------------------------------
// LA CHIAVE DI CARICAMENTO DEL PLAY STORE
// ---------------------------------------------------------------------------
// E' una chiave diversa da quella qui sopra, e ci sono due motivi.
//
// 1. QUELLA SOPRA DEVE RESTARE COM'E'. L'APK che si installa a mano e' firmato
//    con quella: cambiarla farebbe rifiutare ad Android ogni aggiornamento
//    sopra l'installazione esistente, e si perderebbero le corse registrate.
//
// 2. QUESTA NON PUO' STARE NEL REPOSITORY. Chi ce l'ha puo' caricare
//    aggiornamenti dell'app sul Play Store. Arriva quindi dalle variabili
//    d'ambiente - sui runner di GitHub, dai secret - e il file vero non viene
//    mai scritto qui dentro.
//
// Non e' la chiave con cui l'app arriva sui telefoni: quella la tiene Google
// (Play App Signing). Questa serve solo a dire a Google "sono io che carico",
// ed e' il motivo per cui, se si perde, si puo' farsela resettare. L'altra no.
//
// Senza queste variabili non cambia niente: si firma come prima.
def uploadStorePath = System.getenv("FALCATA_UPLOAD_KEYSTORE")
def uploadPassword = System.getenv("FALCATA_UPLOAD_PASSWORD")
def uploadAlias = System.getenv("FALCATA_UPLOAD_ALIAS") ?: "falcata-upload"
def hasUploadKey = uploadStorePath != null &&
        !uploadStorePath.trim().isEmpty() &&
        uploadPassword != null &&
        !uploadPassword.trim().isEmpty() &&
        file(uploadStorePath).exists()

android {
    namespace = "com.runcoachapp.run_coach_app"
    // compileSdk e targetSdk seguono la versione di Flutter installata:
    // cosi' il progetto resta compatibile anche con Flutter piu' recenti.
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.runcoachapp.run_coach_app"
        // minSdk 23: richiesto dai plugin usati (geolocator, flutter_tts) e
        // copre praticamente tutti i telefoni Android in circolazione.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        release {
            // Popolata solo se key.properties esiste: cosi' il progetto
            // continua a compilare anche senza chiave, usando quella di debug.
            if (hasReleaseKey) {
                storeFile = file(keystoreProperties.getProperty("storeFile"))
                storePassword = keystoreProperties.getProperty("storePassword")
                keyAlias = keystoreProperties.getProperty("keyAlias")
                keyPassword = keystoreProperties.getProperty("keyPassword")
            }
        }
        upload {
            if (hasUploadKey) {
                storeFile = file(uploadStorePath)
                storePassword = uploadPassword
                keyAlias = uploadAlias
                keyPassword = uploadPassword
            }
        }
    }

    buildTypes {
        release {
            // Con le variabili della chiave di caricamento presenti si firma
            // per il Play Store; altrimenti resta la firma di sempre, quella
            // dell'APK che si installa a mano.
            signingConfig = hasUploadKey
                    ? signingConfigs.upload
                    : (hasReleaseKey ? signingConfigs.release : signingConfigs.debug)
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}
