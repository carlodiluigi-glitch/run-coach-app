name: Android APK

# Il workflow parte:
#  - manualmente da GitHub -> Actions -> "Android APK" -> "Run workflow"
#  - automaticamente ad ogni push sul branch main
#  - sulle pull request verso main
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.x'
          cache: true

      - name: Versione Flutter usata
        run: flutter --version

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: flutter test
        continue-on-error: true
        run: flutter test

      - name: Build APK release
        run: flutter build apk --release

      - name: Build APK debug
        if: always()
        run: flutter build apk --debug

      - name: Elenco APK generati
        if: always()
        run: ls -lh build/app/outputs/flutter-apk/ || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RunCoach-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
