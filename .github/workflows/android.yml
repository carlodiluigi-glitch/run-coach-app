name: Android APK

# Il workflow parte:
#  - manualmente da GitHub -> Actions -> "Android APK" -> "Run workflow"
#  - automaticamente ad ogni push sul branch main
#  - sulle pull request verso main
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Serve per creare la Release: senza questo il token del workflow puo'
    # solo leggere, e "gh release create" risponderebbe 403.
    permissions:
      contents: write

    steps:
      # 1) Codice sorgente
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Java 17 (richiesto da Android Gradle Plugin 8.x)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3) Flutter con versione FISSATA.
      #
      # Perche' non "ultima stabile": da Flutter 3.47 il plugin Gradle di
      # Flutter porta con se' Android Gradle Plugin 9, che ha cambiato la
      # sintassi dei file Gradle (la "new DSL"). I file android/ di questo
      # progetto usano la sintassi precedente, quindi la build fallirebbe.
      # Fissando la versione, Flutter / Gradle / AGP / Kotlin restano un
      # insieme coerente e collaudato.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: stable
          cache: true

      - name: Versione Flutter usata
        run: flutter --version

      # 4) Dipendenze
      - name: flutter pub get
        run: flutter pub get

      # 5) Analisi statica (non blocca la generazione dell'APK)
      - name: flutter analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # 6) Test unitari (non bloccanti)
      - name: flutter test
        continue-on-error: true
        run: flutter test

      # 7) APK release (firmata con la chiave di debug: nessun secret richiesto)
      - name: Build APK release
        run: flutter build apk --release

      # 8) APK debug (utile come alternativa se la release dovesse fallire)
      - name: Build APK debug
        if: always()
        run: flutter build apk --debug

      - name: Elenco APK generati
        if: always()
        run: ls -lh build/app/outputs/flutter-apk/ || true

      # 8-bis) IL PACCHETTO PER IL PLAY STORE (.aab)
      #
      # PERCHE' DUE PACCHETTI E DUE CHIAVI
      # ----------------------------------
      # L'APK qui sopra e' quello che Carlo si installa a mano, ed e' firmato
      # con la chiave che sta nel repository: deve restare quella, se no
      # Android rifiuta l'aggiornamento sopra l'installazione esistente e si
      # perderebbero le corse.
      #
      # Il Play Store vuole invece un .aab firmato con una chiave di
      # CARICAMENTO che non sta nel repository: arriva dai secret, e il file
      # vero non tocca mai il disco del repo. Sono due comandi separati proprio
      # per questo - stessa build, due firme diverse, senza che una tocchi
      # l'altra.
      #
      # Finche' i secret non ci sono, questi passi si saltano da soli: il
      # workflow continua a funzionare come prima.
      - name: Prepara la chiave di caricamento
        env:
          CHIAVE: ${{ secrets.FALCATA_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$CHIAVE" ]; then
            printf '%s' "$CHIAVE" | base64 -d > "$RUNNER_TEMP/falcata-upload.jks"
            echo "CHIAVE_PRONTA=1" >> "$GITHUB_ENV"
            echo "Chiave di caricamento pronta."
          else
            echo "Nessuna chiave di caricamento nei secret: salto il pacchetto per il Play Store."
          fi

      - name: Pacchetto per il Play Store
        if: env.CHIAVE_PRONTA == '1'
        env:
          FALCATA_UPLOAD_KEYSTORE: ${{ runner.temp }}/falcata-upload.jks
          FALCATA_UPLOAD_PASSWORD: ${{ secrets.FALCATA_UPLOAD_PASSWORD }}
          FALCATA_UPLOAD_ALIAS: falcata-upload
        run: flutter build appbundle --release

      # L'aab NON va nella Release pubblica: serve solo a essere caricato in
      # Play Console, e si scarica da qui.
      - name: Upload del pacchetto Play Store
        if: env.CHIAVE_PRONTA == '1'
        uses: actions/upload-artifact@v4
        with:
          name: Falcata-PlayStore-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # 9) Pubblicazione dell'artifact scaricabile
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Falcata-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 10) Release: l'APK diventa un file scaricabile con un tocco dal
      #     telefono, senza PC e senza zip.
      #
      # PERCHE' NON UN'ACTION DI TERZI: "gh" (la riga di comando di GitHub) e'
      # gia' installata sui runner ubuntu, quindi non serve fidarsi di codice
      # esterno per una cosa che tocca il repository in scrittura.
      #
      # Il messaggio del commit passa da una variabile d'ambiente e non
      # incollato dentro il comando: se contenesse virgolette o apici, il
      # comando si spezzerebbe.
      - name: Pubblica la Release
        if: github.ref == 'refs/heads/main' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGGIO: ${{ github.event.head_commit.message }}
        run: |
          set -e
          VERSIONE=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          NOME="Falcata-$VERSIONE-build${{ github.run_number }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$NOME"
          NOTE="Versione $VERSIONE, build ${{ github.run_number }}.

          $MESSAGGIO

          Per installare: scarica il file .apk qui sotto dal telefono e
          aprilo. Se Android chiede il permesso di installare da questa
          origine, concedilo una volta sola."
          gh release create "b${{ github.run_number }}" "$NOME" \
            --title "Falcata $VERSIONE (build ${{ github.run_number }})" \
            --notes "$NOTE" \
            --latest
