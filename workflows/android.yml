name: Android APK

# Il workflow parte:
#  - manualmente da GitHub -> Actions -> "Android APK" -> "Run workflow"
#  - automaticamente ad ogni push sul branch main
#  - sulle pull request verso main
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1) Codice sorgente
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Java 17 (richiesto da Android Gradle Plugin 8.x)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3) Flutter stabile
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versione Flutter usata
        run: flutter --version

      # 4) Dipendenze
      - name: flutter pub get
        run: flutter pub get

      # 5) Analisi statica (non blocca la generazione dell'APK)
      - name: flutter analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # 6) Test unitari (non bloccanti)
      - name: flutter test
        continue-on-error: true
        run: flutter test

      # 7) APK release (firmata con la chiave di debug: nessun secret richiesto)
      - name: Build APK release
        run: flutter build apk --release

      # 8) APK debug (utile come alternativa se la release dovesse fallire)
      - name: Build APK debug
        if: always()
        run: flutter build apk --debug

      - name: Elenco APK generati
        if: always()
        run: ls -lh build/app/outputs/flutter-apk/ || true

      # 9) Pubblicazione dell'artifact scaricabile
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RunCoach-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
